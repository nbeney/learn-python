<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Python Visualizer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;font:14px system-ui,sans-serif;background:#f4f6fa;color:#222}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#fff;border-bottom:1px solid #d8dce5}
button{font:inherit;padding:6px 14px;border:0;border-radius:6px;cursor:pointer;background:#e3e7ef}
button:disabled{opacity:.4;cursor:default}
#go{color:#fff;font-weight:700;min-width:110px;background:#1f9d4c}
#go.edit{background:#d93a3a}
#nav{display:none;gap:6px;align-items:center}
#opts{margin-left:auto;display:none;gap:12px;align-items:center;font-size:13px}
main{flex:1;display:grid;grid-template-columns:minmax(300px,40%) 1fr;gap:10px;padding:10px;min-height:0}
.col{display:flex;flex-direction:column;gap:10px;min-height:0}
.pan{background:#fff;border:1px solid #d8dce5;border-radius:8px;display:flex;flex-direction:column;min-height:0}
.pan>h3{margin:0;padding:5px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#667;border-bottom:1px solid #eceff4}
#ed{flex:1;min-height:0}.CodeMirror{height:100%;font:14px/1.45 ui-monospace,Consolas,monospace}
#stdin{height:90px;border:0;padding:8px;font:14px ui-monospace,Consolas,monospace;resize:vertical;outline:0}
.marks{width:20px}.mk{font-size:13px;text-align:center}
.cl-next{background:#d9ecff!important}.cl-last{background:#e6e6e6!important}
#viz{flex:1;position:relative;overflow:auto;padding:10px;display:flex;gap:30px;align-items:flex-start}
#viz>svg{position:absolute;left:0;top:0;pointer-events:none;z-index:5}
#frames{display:flex;flex-direction:column;gap:8px;min-width:230px}
#heap{display:flex;flex-wrap:wrap;gap:16px 26px;align-content:flex-start;flex:1}
.fr{border:2px solid #9ab;border-radius:8px;background:#f0f6ff;min-width:220px}
.fr.cur{border-color:#2a6fdb;background:#e4efff}
.fr>.fh{padding:3px 8px;font-weight:700;background:#cfe0f7;border-radius:6px 6px 0 0}
.row{display:flex;align-items:center;gap:6px;padding:3px 8px;font-family:ui-monospace,Consolas,monospace}
.row b{min-width:40px}.ic{display:inline-block;min-width:22px;text-align:center;font-size:11px;border-radius:9px;background:#6a7ea8;color:#fff;padding:1px 4px}
.prim{color:#0a5}.t-str{color:#b4570a}.t-NoneType{color:#889}
.ptr{display:inline-block;width:11px;height:11px;border-radius:50%;background:#e8590c}
.flash{animation:fl 1.1s}@keyframes fl{0%,40%{background:#ffe066}100%{background:transparent}}
.obj{border:2px solid #666;border-radius:8px;background:#fff;position:relative;touch-action:none}
.oh{padding:2px 8px;font-weight:700;cursor:grab;color:#fff;border-radius:5px 5px 0 0;font-size:12px;user-select:none;background:#556}
.k-List .oh{background:#2f7ad8}.k-Tuple .oh{background:#7b57c9}.k-Dict .oh{background:#c2570c}.k-Set .oh{background:#198a8a}
.k-Object .oh{background:#a33a7a}.k-Class .oh,.k-Function .oh,.k-Module .oh{background:#777}
.cells{display:flex}.cell{border-right:1px solid #ccd;padding:2px 8px;text-align:center;min-width:34px}
.cell:last-child{border:0}.cell i{display:block;font-size:10px;color:#99a;font-style:normal}
#cons{height:150px;margin:0;padding:8px;overflow:auto;background:#1b1e27;color:#e6e6e6;font:13px ui-monospace,Consolas,monospace;white-space:pre-wrap;border-radius:0 0 8px 8px}
#cons .i{color:#7ee787}#cons .e{color:#ff7b72}
#hint{color:#889;padding:20px}
#sbar{display:none;padding:4px 12px;background:#fff;border-bottom:1px solid #d8dce5}body.viz #sbar{display:block}#sl{width:100%;display:block;margin:0}#sl{accent-color:#2a6fdb}#sl:focus,#sl:focus-visible{outline:none}
.cl-err{background:#ffd6d6!important}
.tg input{display:none}.tg span{display:inline-block;padding:4px 10px;border:1px solid #b9c0d0;border-radius:6px;background:#fff;cursor:pointer;font-size:12px}
.tg input:checked+span{background:#2a6fdb;color:#fff;border-color:#2a6fdb}.grp{display:flex;align-items:center;gap:6px;font-size:12px;color:#667}
.grp .tg span{border-radius:0;margin-left:-7px}.grp small{margin-right:0}.grp .tg:first-of-type span{border-radius:6px 0 0 6px;margin-left:0}.grp .tg:last-child span{border-radius:0 6px 6px 0}
#oScope{font-size:12px;padding:4px}#pos{min-width:110px;text-align:center}#cons .s{color:#8b93a7}
table.g{border-collapse:collapse}.g td,.g th{border:1px solid #ccd;padding:2px 8px;text-align:center}.g th{background:#eef;font-size:10px;color:#889}

const PY = String.raw`
import sys, json, builtins, types, traceback, linecache
class Stop(BaseException): pass
def short(v):
    if isinstance(v, types.ModuleType): return "module " + v.__name__
    if isinstance(v, type): return "class " + v.__name__
    if isinstance(v, (types.FunctionType, types.BuiltinFunctionType, types.MethodType)): return "ƒ " + getattr(v, "__name__", "?")
    try: r = repr(v)
    except Exception: r = "<" + type(v).__name__ + ">"
    if "object at 0x" in r: r = type(v).__name__ + " object"
    return r if len(r) < 60 else r[:57] + "..."
def run_trace(src, inputs_json):
    inp = json.loads(inputs_json); steps = []; events = []; seen_exc = {}; errln = [None]; ids = {}; keep = []; MAX = 2000
    def sid(o):
        k = id(o)
        if k not in ids: ids[k] = len(ids) + 1; keep.append(o)
        return ids[k]
    def enc(v, heap):
        if isinstance(v, (int, float, str, bool, type(None), complex)):
            r = repr(v); return ["p", r if len(r) < 60 else r[:57] + "...", type(v).__name__]
        n = sid(v)
        if n not in heap: describe(v, n, heap)
        return ["r", n]
    def describe(v, n, heap):
        o = {"t": type(v).__name__, "r": short(v), "k": type(v).__name__}; heap[n] = o
        if isinstance(v, (list, tuple)):
            o["k"] = "List" if isinstance(v, list) else "Tuple"; o["items"] = [enc(x, heap) for x in list(v)[:40]]
        elif isinstance(v, (set, frozenset)):
            o["k"] = "Set"; o["items"] = [enc(x, heap) for x in list(v)[:40]]
        elif isinstance(v, dict):
            o["k"] = "Dict"; o["pairs"] = [[enc(a, heap), enc(b, heap)] for a, b in list(v.items())[:40]]
        elif isinstance(v, types.ModuleType): o["k"] = "Module"
        elif isinstance(v, type): o["k"] = "Class"; o["nm"] = v.__name__; o["meths"] = [a for a, b in vars(v).items() if isinstance(b, types.FunctionType)]
        elif isinstance(v, (types.FunctionType, types.BuiltinFunctionType, types.MethodType)):
            o["k"] = "Function"
            if isinstance(v, types.FunctionType):
                c = v.__code__; nm = c.co_varnames[:c.co_argcount]; d = v.__defaults__ or ()
                o["defs"] = [[a, enc(b, heap)] for a, b in zip(nm[len(nm) - len(d):], d)] + [[a, enc(b, heap)] for a, b in (v.__kwdefaults__ or {}).items()]
                if not o["defs"]: del o["defs"]
        elif hasattr(v, "__dict__"):
            o["k"] = "Object"; o["attrs"] = [[a, enc(b, heap)] for a, b in list(vars(v).items())[:40]]
    def snap(frame, nxt, has_ret=False, ret=None):
        heap = {}; chain = []; f = frame
        while f is not None:
            if f.f_code.co_filename == "<user>": chain.append(f)
            f = f.f_back
        fr = []
        for f in reversed(chain):
            d = f.f_globals if f.f_code.co_name == "<module>" else f.f_locals
            fr.append({"n": f.f_code.co_name, "v": [[k, enc(x, heap)] for k, x in list(d.items()) if not k.startswith("__")]})
        s = {"line": nxt, "f": fr, "h": heap}
        if has_ret: s["ret"] = enc(ret, heap)
        return s
    def tracer(frame, event, arg):
        if frame.f_code.co_filename != "<user>": return None
        if event == "call": return tracer
        if event == "exception":
            if seen_exc.get("e") is not arg[1] and not isinstance(arg[1], StopIteration):
                seen_exc["e"] = arg[1]; s = snap(frame, frame.f_lineno); s["exc"] = 1; steps.append(s)
            return tracer
        if event == "line" or event == "return":
            if len(steps) >= MAX: raise Stop()
            if event == "line": steps.append(snap(frame, frame.f_lineno))
            else:
                b = frame.f_back; top = frame.f_code.co_name == "<module>"
                nxt = b.f_lineno if (b is not None and not top and b.f_code.co_filename == "<user>") else None
                steps.append(snap(frame, nxt, not top, arg))
        return tracer
    class W:
        def write(self, s): events.append([len(steps), "o", s]); return len(s)
        def flush(self): pass
    def my_input(prompt=""):
        if prompt: events.append([len(steps), "o", str(prompt)])
        if not inp: raise EOFError("No more input lines")
        s = inp.pop(0); events.append([len(steps), "i", s + "\n"]); return s
    old_out, old_in = sys.stdout, builtins.input
    sys.stdout = W(); builtins.input = my_input
    try:
        code = compile(src, "<user>", "exec"); linecache.cache["<user>"] = (len(src), None, src.splitlines(True), "<user>"); sys.settrace(tracer); exec(code, {"__name__": "__main__"})
    except Stop:
        events.append([len(steps) - 1, "e", "Stopped: more than %d steps (infinite loop?)\n" % MAX])
    except BaseException as e:
        if isinstance(e, SyntaxError) or e.__traceback__ is None or not steps:
            ln = getattr(e, "lineno", None); errln[0] = ln; msg = ("Line %s: " % ln if ln else "") + "".join(traceback.format_exception_only(type(e), e))
        else:
            for k in range(len(steps) - 1, -1, -1):
                if steps[k].get("exc"): del steps[k + 1:]; break
            msg = "".join(traceback.format_exception(type(e), e, e.__traceback__.tb_next))
        events.append([max(len(steps) - 1, 0), "e", msg])
    finally:
        sys.settrace(None); sys.stdout = old_out; builtins.input = old_in
    return json.dumps({"steps": steps, "events": events, "errline": errln[0]})

const SAMPLE = `name = input("Name? ")

def greet(who, times):
    msg = ""
    for i in range(times):
        msg = msg + "Hi " + who + "! "
    return msg

scores = [3, 5]
scores.append(len(name))
pet = {"name": name, "scores": scores}
print(greet(name, 2))
print(pet)
`;
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cm = CodeMirror($('#ed'), {value: SAMPLE, mode: 'python', lineNumbers: true, indentUnit: 4,
  gutters: ['CodeMirror-linenumbers', 'marks'], extraKeys: {Tab: 'indentMore', 'Shift-Tab': 'indentLess', 'Ctrl-/': 'toggleComment', 'Cmd-/': 'toggleComment'}});
const ICON = {int:'#',float:'.5',str:'"',bool:'✓',NoneType:'∅',list:'[ ]',tuple:'( )',dict:'{ }',set:'{·}',function:'ƒ',type:'C',module:'M'};
let py, mode = 'edit', steps = [], events = [], cur = 0, prevF = null, prevH = null, offs = {};
const opts = () => ({noObj: $('#oObj').checked, hide: new Set([['oF','Function'],['oC','Class'],['oM','Module']].filter(a => $('#' + a[0]).checked).map(a => a[1])), grid: $('#oGrid').checked, scope: $('#oScope').value});

function val(v, h, o) {
  if (v[0] === 'p') return `<span class="prim t-${v[2]}">${esc(v[1])}</span>`;
  const x = h[v[1]];
  if (o.noObj || o.hide.has(x.k)) return `<span class="prim">${esc(x.r)}</span>`;
  return `<span class="ptr" data-t="${v[1]}"></span>`;
}
const refs = x => [].concat(x.items || [], (x.pairs || []).flat(), (x.attrs || []).map(a => a[1]), (x.defs || []).map(a => a[1])).filter(v => v[0] === 'r').map(v => v[1]);
const icon = (v, h) => { const t = v[0] === 'p' ? v[2] : h[v[1]].t; return `<span class="ic" title="${t}">${ICON[t] || '◆'}</span>`; };

function render() {
  const s = steps[cur], prev = cur > 0 ? steps[cur - 1] : null, o = opts(), h = s.h;
  $('#pos').textContent = `Step ${cur + 1} of ${steps.length}`;
  $('#sl').max = steps.length - 1; $('#sl').value = cur; $('#b1').disabled = $('#b2').disabled = cur === 0; $('#b3').disabled = $('#b4').disabled = cur === steps.length - 1;
  cm.eachLine(l => { cm.setGutterMarker(l, 'marks', null); cm.removeLineClass(l, 'background', 'cl-next'); cm.removeLineClass(l, 'background', 'cl-last'); cm.removeLineClass(l, 'background', 'cl-err'); });
  const mark = (ln, cls, ic) => { if (!ln) return; cm.addLineClass(ln - 1, 'background', cls); const e = document.createElement('div'); e.className = 'mk'; e.textContent = ic; cm.setGutterMarker(ln - 1, 'marks', e); };
  const ex = s.exc && cur === steps.length - 1;
  if (prev && !(ex && prev.line === s.line)) mark(prev.line, 'cl-last', '✔');
  mark(s.line, ex ? 'cl-err' : 'cl-next', ex ? '✖' : '▶');
  if (s.line) cm.scrollIntoView({line: s.line - 1, ch: 0}, 50);
  // frames
  const F = {}, n = s.f.length;
  let html = '';
  s.f.forEach((f, i) => {
    html = `<div class="fr${i === n - 1 ? ' cur' : ''}"><div class="fh">${f.n === '<module>' ? 'Global frame' : esc(f.n) + '()'}</div>` +
      f.v.map(([k, v]) => { const key = i + f.n + ':' + k, js = JSON.stringify(v) + (o.noObj && v[0] === 'r' ? JSON.stringify(h[v[1]]) : ''); F[key] = js;
        const ch = !prevF || prevF[key] !== js ? ' flash' : '';
        return `<div class="row${prevF ? ch : ''}">${icon(v, h)}<b>${esc(k)}</b>${val(v, h, o)}</div>`; }).join('') +
      (i === n - 1 && s.ret ? `<div class="row">↩<b>return</b>${val(s.ret, h, o)}</div>` : '') + '</div>' + html;
  });
  $('#hint')?.remove();
  // heap
  let vis = Object.keys(h).map(Number);
  if (o.scope === 'cur' && n) { const seen = new Set(), q = s.f[n - 1].v.map(a => a[1]).filter(v => v[0] === 'r').map(v => v[1]);
    while (q.length) { const x = q.pop(); if (!seen.has(x)) { seen.add(x); q.push(...refs(h[x])); } } vis = vis.filter(x => seen.has(x)); }
  const isGrid = x => o.grid && x.k === 'List' && x.items.length && x.items.every(v => v[0] === 'r' && h[v[1]].k === 'List' && h[v[1]].items.every(w => w[0] === 'p'));
  const rows = new Set(); vis.forEach(id => isGrid(h[id]) && h[id].items.forEach(v => rows.add(v[1])));
  vis = vis.filter(x => !o.hide.has(h[x].k) && !rows.has(x));
  const H = {}, cell = (v, lbl) => `<div class="cell"><i>${lbl}</i>${val(v, h, o)}</div>`;
  const hh = o.noObj ? '' : vis.sort((a, b) => a - b).map(id => {
    const x = h[id], js = JSON.stringify(x) + (isGrid(x) ? JSON.stringify(x.items.map(v => h[v[1]])) : ''); H[id] = js; let body;
    if (isGrid(x)) { const cols = Math.max(...x.items.map(v => h[v[1]].items.length)); body = `<table class="g"><tr><th></th>${Array.from({length: cols}, (_, c) => `<th>${c}</th>`).join('')}</tr>${x.items.map((v, r) => `<tr><th>${r}</th>${h[v[1]].items.map(w => `<td>${val(w, h, o)}</td>`).join('')}</tr>`).join('')}</table>`; }
    else if (x.items) body = `<div class="cells">${x.items.map((v, i) => cell(v, x.k === 'Set' ? '' : i)).join('') || '<div class="cell">empty</div>'}</div>`;
    else if (x.pairs) body = x.pairs.map(([a, b]) => `<div class="row">${val(a, h, o)}→${val(b, h, o)}</div>`).join('') || '<div class="row">empty</div>';
    else if (x.defs) body = `<div class="row prim">${esc(x.r)}</div>` + x.defs.map(([k, v]) => `<div class="row"><b>${esc(k)}</b>=${val(v, h, o)}</div>`).join('');
    else if (x.meths) body = x.meths.map(m => `<div class="row">ƒ ${esc(m)}()</div>`).join('') || '<div class="row">no methods</div>';
    else if (x.attrs) body = x.attrs.map(([k, v]) => `<div class="row"><b>${esc(k)}</b>${val(v, h, o)}</div>`).join('') || '<div class="row">no attributes</div>';
    else body = `<div class="row prim">${esc(x.r)}</div>`;
    const [dx, dy] = offs[id] || [0, 0], fl = prevH && prevH[id] !== js ? ' flash' : '';
    return `<div class="obj k-${x.k}" id="o${id}" style="transform:translate(${dx}px,${dy}px)"><div class="oh" data-id="${id}">#${id} ${x.k}${x.k === 'Object' ? ' · ' + esc(x.t) : x.k === 'Class' ? ' - ' + esc(x.nm) : ''}</div><div class="${fl}">${body}</div></div>`;
  }).join('');
  prevF = F; prevH = H;
  const v = $('#viz'); [...v.children].forEach(c => c.id !== 'svg' && c.remove());
  v.insertAdjacentHTML('beforeend', `<div id="frames">${html}</div><div id="heap">${hh}</div>`);
  drawArrows();
  // console
  $('#cons').innerHTML = events.filter(e => e[0] <= cur).map(e => `<span class="${e[1]}">${esc(e[2])}</span>`).join('');
  $('#cons').scrollTop = 1e9;
}
function drawArrows() {
  const v = $('#viz'), svg = $('#svg'); svg.setAttribute('width', 0); svg.setAttribute('height', 0);
  const W = v.scrollWidth, Hh = v.scrollHeight, vr = v.getBoundingClientRect();
  svg.setAttribute('width', W); svg.setAttribute('height', Hh);
  svg.querySelectorAll('path').forEach(p => p.remove());
  v.querySelectorAll('.ptr').forEach(p => {
    const t = $('#o' + p.dataset.t); if (!t) return;
    const a = p.getBoundingClientRect(), b = t.getBoundingClientRect();
    const x1 = a.left + a.width / 2 - vr.left + v.scrollLeft, y1 = a.top + a.height / 2 - vr.top + v.scrollTop;
    const x2 = b.left - vr.left + v.scrollLeft, y2 = b.top + 14 - vr.top + v.scrollTop, d = Math.max(30, Math.abs(x2 - x1) / 2);
    const e = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    e.setAttribute('d', `M${x1} ${y1}C${x1 + d} ${y1} ${x2 - d} ${y2} ${x2} ${y2}`);
    e.setAttribute('fill', 'none'); e.setAttribute('stroke', '#e8590c'); e.setAttribute('stroke-width', 1.6); e.setAttribute('marker-end', 'url(#ah)');
    svg.appendChild(e);
  });
}
// drag & drop of heap objects
$('#viz').addEventListener('pointerdown', e => {
  const hd = e.target.closest('.oh'); if (!hd) return;
  const id = hd.dataset.id, el = hd.parentElement, [ox, oy] = offs[id] || [0, 0], sx = e.clientX, sy = e.clientY;
  hd.setPointerCapture(e.pointerId);
  const mv = ev => { offs[id] = [ox + ev.clientX - sx, oy + ev.clientY - sy]; el.style.transform = `translate(${offs[id][0]}px,${offs[id][1]}px)`; drawArrows(); };
  hd.addEventListener('pointermove', mv); hd.addEventListener('pointerup', () => hd.removeEventListener('pointermove', mv), {once: true});
});
window.addEventListener('resize', () => mode === 'viz' && drawArrows());

function go(i) { cur = Math.max(0, Math.min(steps.length - 1, i)); render(); }
$('#sl').oninput = e => go(+e.target.value); $('#b1').onclick = () => go(0); $('#b2').onclick = () => go(cur - 1);
$('#b3').onclick = () => go(cur + 1); $('#b4').onclick = () => go(steps.length - 1);
['oObj', 'oF', 'oC', 'oM', 'oGrid', 'oScope'].forEach(id => $('#' + id).onchange = () => mode === 'viz' && (prevF = prevH = null, render()));

function setEdit() {
  if (mode === 'edit') return; mode = 'edit'; document.body.classList.remove('viz');
  $('#go').textContent = 'Visualize'; $('#go').classList.remove('edit'); $('#nav').style.display = 'none';
  cm.eachLine(l => { cm.setGutterMarker(l, 'marks', null); cm.removeLineClass(l, 'background', 'cl-next'); cm.removeLineClass(l, 'background', 'cl-last'); cm.removeLineClass(l, 'background', 'cl-err'); });
  [...$('#viz').children].forEach(c => c.id !== 'svg' && c.remove());
  $('#viz').insertAdjacentHTML('beforeend', '<div id="hint">Click <b>Visualize</b> to run your program step by step.</div>');
  $('#cons').textContent = ''; $('#opts').style.display = 'none'; $('#ex').style.display = '';
  $('#svg').querySelectorAll('path').forEach(p => p.remove()); cm.focus();
}
function setViz() {
  const lines = $('#stdin').value.split('\n'); if (lines.at(-1) === '') lines.pop();
  const r = JSON.parse(py.globals.get('run_trace')(cm.getValue(), JSON.stringify(lines)));
  steps = r.steps; events = r.events; offs = {}; prevF = prevH = null; cur = 0;
  if (!steps.length) { if (r.errline) { cm.addLineClass(r.errline - 1, 'background', 'cl-err'); const m = document.createElement('div'); m.className = 'mk'; m.textContent = '✖'; cm.setGutterMarker(r.errline - 1, 'marks', m); }
    $('#cons').innerHTML = events.map(e => `<span class="${e[1]}">${esc(e[2])}</span>`).join('') || 'Nothing to run.'; return; }
  mode = 'viz'; document.body.classList.add('viz'); $('#go').textContent = 'Edit'; $('#go').classList.add('edit'); $('#nav').style.display = 'flex'; $('#opts').style.display = 'flex'; $('#ex').style.display = 'none'; render(); $('#sl').focus();
}
const toggle = () => { if (!py) return; mode === 'edit' ? setViz() : setEdit(); };
$('#go').onclick = toggle;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); setEdit(); cm.focus(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); toggle(); }
  else if (mode === 'viz' && e.ctrlKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); e.stopPropagation(); go(e.key === 'ArrowLeft' ? 0 : steps.length - 1); }
  else if (mode === 'viz' && !e.target.closest('#ed,textarea,input,select') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) go(cur + (e.key === 'ArrowRight' ? 1 : -1));
}, true);
for (const [g, list] of Object.entries(window.PV_EXAMPLES || {})) { const og = document.createElement('optgroup'); og.label = g; list.forEach(x => { const op = new Option(x.title, ''); op.ex = x; og.appendChild(op); }); $('#ex').appendChild(og); }
$('#ex').onchange = e => { const o = e.target.selectedOptions[0]; if (!o.ex) return; cm.setValue(o.ex.code.replace(/^\n/, '')); $('#stdin').value = (o.ex.stdin || '').replace(/^\n/, ''); e.target.selectedIndex = 0; cm.focus(); };
const clearMarks = () => cm.eachLine(l => { cm.setGutterMarker(l, 'marks', null); ['cl-next', 'cl-last', 'cl-err'].forEach(c => cm.removeLineClass(l, 'background', c)); });
cm.on('change', () => { clearMarks(); setEdit(); }); $('#stdin').addEventListener('input', setEdit);

(async () => {
  py = await loadPyodide(); py.runPython(PY);
  $('#go').disabled = false; $('#go').textContent = 'Visualize';
})();
</script></body></html>
