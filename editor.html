<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🐍 Python Editor</title>

<!-- Apply the saved theme before paint to avoid a flash of the wrong colours. -->
<script>
  (function () {
    var t = localStorage.getItem("theme") || "system";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>

<style>
  /* Light theme is the base. */
  :root {
    --bg: #f6f8fa;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #57606a;
    --accent: #0969da;
    --border: #d0d7de;
  }
  :root[data-theme="dark"] {
    --bg: #0d1117;
    --card: #161b22;
    --text: #e6edf3;
    --muted: #9da7b3;
    --accent: #58a6ff;
    --border: #30363d;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="system"], :root:not([data-theme]) {
      --bg: #0d1117;
      --card: #161b22;
      --text: #e6edf3;
      --muted: #9da7b3;
      --accent: #58a6ff;
      --border: #30363d;
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    padding: 1rem;
    gap: .8rem;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: .5rem;
  }
  header h1 { font-size: 2.4rem; margin: 0; }

  .toolbar { display: flex; gap: .5rem; align-items: center; }
  .btn {
    border: none; font-weight: 600; font-size: .9rem;
    padding: .45rem 1rem; border-radius: 8px; cursor: pointer;
  }
  .run-btn { background: var(--accent); color: #fff; }
  .run-btn:disabled { opacity: .6; cursor: wait; }

  /* Run button row, left-aligned directly under the editor. */
  .run-row { display: flex; justify-content: flex-start; }

  /* The file toolbar is hidden by default; the menu toggles it on. */
  body:not(.toolbar-visible) .toolbar { display: none; }

  /* File manager + samples controls in the toolbar. */
  .files { display: inline-flex; align-items: center; gap: .3rem; }
  .files-label { font-size: 1rem; line-height: 1; }
  .select {
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font: inherit; font-size: .9rem; padding: .4rem .5rem;
    cursor: pointer; max-width: 11rem;
  }
  .select:hover { border-color: var(--accent); }
  .icon-btn {
    background: var(--card); color: var(--text);
    border: 1px solid var(--border);
    padding: .4rem .55rem; font-size: .9rem; line-height: 1;
  }
  .icon-btn:hover { border-color: var(--accent); }
  /* Let the hint wrap to a new line on narrow screens. */
  .toolbar { flex-wrap: wrap; }

  /* ---------- Corner menu (navigation + theme) ---------- */
  /* Align the menu's right edge with the page content (body has 1rem padding). */
  .menu { position: fixed; top: 12px; right: 1rem; z-index: 50; }
  .menu-btn {
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 1.2rem; line-height: 1; cursor: pointer;
    width: 42px; height: 42px;
  }
  .menu-btn:hover { border-color: var(--accent); }
  .menu-panel {
    position: absolute; top: 48px; right: 0;
    min-width: 180px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: .4rem;
    box-shadow: 0 10px 24px rgba(0,0,0,.22);
    display: none;
  }
  .menu.open .menu-panel { display: block; }
  .menu-panel a {
    display: block; text-decoration: none;
    color: var(--text); font-size: .95rem;
    padding: .5rem .6rem; border-radius: 8px;
  }
  .menu-panel a:hover { background: rgba(127,127,127,.14); }
  .menu-panel a[aria-current="page"] {
    color: var(--muted); font-weight: 600; pointer-events: none;
  }
  .menu-panel a[aria-current="page"]::after { content: " ●"; color: var(--accent); }
  .menu-sep { height: 1px; background: var(--border); margin: .4rem .2rem; }
  .menu-label { font-size: .75rem; color: var(--muted); padding: .2rem .6rem; }

  /* The snake emoji in the title links home; keep it looking like plain text. */
  .home-emoji { color: inherit; text-decoration: none; cursor: pointer; }
  .home-emoji:hover { filter: brightness(1.15); }

  /* Theme switcher (Light / Dark / System), lives inside the menu. */
  .theme-switch {
    display: flex; gap: .15rem; padding: .2rem .4rem .3rem;
  }
  .theme-switch button {
    flex: 1; background: transparent; border: 1px solid var(--border);
    cursor: pointer; color: var(--muted); font-size: .95rem; line-height: 1;
    padding: .4rem; border-radius: 8px;
  }
  .theme-switch button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .theme-switch button:hover { color: var(--text); }
  .theme-switch button[aria-pressed="true"]:hover { color: #fff; }

  /* Editor fills the available space; output sits below it. */
  .editor-wrap {
    flex: 1 1 auto;
    min-height: 180px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .cm-editor { height: 100%; font-size: 1rem; }
  .cm-editor.cm-focused { outline: none; }

  .output {
    flex: 0 0 auto;
    max-height: 40vh; overflow: auto;
    background: #000; color: #d1f7c4;
    border-radius: 8px; padding: .7rem .9rem; min-height: 2.4rem;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: .95rem; white-space: pre-wrap;
    border: 1px solid var(--border);
  }
  .output .answer { color: #ffd866; font-weight: 600; }
  .output .error { color: #ff9c8a; }

  /* Inline input() field: looks like typing straight into the output. */
  .output .inline-input {
    background: transparent; border: none; outline: none;
    color: #ffd866; font-weight: 600;
    font-family: inherit; font-size: inherit;
    padding: 0; margin: 0; min-width: 4ch;
    caret-color: #ffd866;
  }
  .output.awaiting-input { cursor: text; }

  #status {
    position: fixed; bottom: 10px; right: 12px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); font-size: .8rem;
    padding: .35rem .7rem; border-radius: 20px;
  }

  .hint { color: var(--muted); font-size: .82rem; margin: 0; }
</style>
</head>
<body>

<!-- Corner menu: navigation + theme. Shared across sub-pages. -->
<nav class="menu no-print" id="menu">
  <button class="menu-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="Menu">☰</button>
  <div class="menu-panel" role="menu">
    <a href="index.html" role="menuitem">🏠 Home</a>
    <a href="cheatsheet.html" role="menuitem">📖 Cheatsheet</a>
    <a href="shell.html" role="menuitem">⌨️ Shell</a>
    <a href="editor.html" role="menuitem" aria-current="page">📝 Editor</a>
    <div class="menu-sep"></div>
    <a href="#" id="toolbarToggle" role="menuitemcheckbox" aria-checked="false">⬜ Toolbar</a>
    <div class="menu-sep"></div>
    <div class="menu-label">Theme</div>
    <div class="theme-switch" role="group" aria-label="Colour theme">
      <button data-theme-value="light"  title="Light">☀️</button>
      <button data-theme-value="dark"   title="Dark">🌙</button>
      <button data-theme-value="system" title="Match system">💻</button>
    </div>
  </div>
</nav>

  <header>
    <h1><a href="index.html" class="home-emoji" title="Home" aria-label="Home">🐍</a> Python Editor</h1>
  </header>

  <div class="toolbar">
    <!-- File manager: pick/create/rename/copy/delete local files. -->
    <span class="files">
      <label class="files-label" for="fileSelect">📁</label>
      <select id="fileSelect" class="select" title="Your saved files"></select>
      <button id="fileNew"    class="btn icon-btn" title="New file">➕</button>
      <button id="fileCopy"   class="btn icon-btn" title="Make a copy">📄</button>
      <button id="fileRename" class="btn icon-btn" title="Rename file">✏️</button>
      <button id="fileDelete" class="btn icon-btn" title="Delete file">🗑️</button>
    </span>

    <!-- Samples: load an example program into the current file. -->
    <span class="files">
      <label class="files-label" for="sampleSelect">📚</label>
      <select id="sampleSelect" class="select" title="Load a sample program">
        <option value="">Samples…</option>
      </select>
    </span>
  </div>

  <div class="editor-wrap" id="editor"></div>

  <!-- Run sits directly under the code block, right-aligned. -->
  <div class="run-row">
    <button id="run" class="btn run-btn" disabled>▶ Run</button>
  </div>

  <div class="output" id="output">The program output will show up here.</div>

  <div id="status">🐍 Loading Python…</div>

<!-- Menu + theme wiring. Standalone so it works regardless of Pyodide. -->
<script>
  (function () {
    var root = document.documentElement;
    var buttons = document.querySelectorAll(".theme-switch button");
    function applyTheme(theme) {
      root.setAttribute("data-theme", theme);
      localStorage.setItem("theme", theme);
      buttons.forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.themeValue === theme));
      });
    }
    buttons.forEach(function (b) {
      b.addEventListener("click", function () { applyTheme(b.dataset.themeValue); });
    });
    applyTheme(localStorage.getItem("theme") || "system");

    var menu = document.getElementById("menu");
    var menuBtn = document.getElementById("menuBtn");
    if (menu && menuBtn) {
      function setOpen(open) {
        menu.classList.toggle("open", open);
        menuBtn.setAttribute("aria-expanded", String(open));
      }
      menuBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        setOpen(!menu.classList.contains("open"));
      });
      document.addEventListener("click", function (e) {
        if (!menu.contains(e.target)) setOpen(false);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") setOpen(false);
      });
    }

    // File toolbar visibility: hidden by default, toggled from the menu and
    // remembered across visits.
    var toolbarToggle = document.getElementById("toolbarToggle");
    if (toolbarToggle) {
      function applyToolbar(visible) {
        document.body.classList.toggle("toolbar-visible", visible);
        toolbarToggle.setAttribute("aria-checked", String(visible));
        toolbarToggle.textContent = (visible ? "✅" : "⬜") + " Toolbar";
        localStorage.setItem("editor:toolbar", visible ? "1" : "0");
      }
      applyToolbar(localStorage.getItem("editor:toolbar") === "1"); // default hidden
      toolbarToggle.addEventListener("click", function (e) {
        e.preventDefault();
        applyToolbar(!document.body.classList.contains("toolbar-visible"));
      });
    }
  })();
</script>

<!-- CodeMirror 6 (locally bundled) + Pyodide.
     assets/codemirror.min.js is a single esbuild bundle containing one copy
     of @codemirror/state, so extensions never fail instanceof checks and it
     works offline. Rebuild with: cd vendor && npm run build -->
<script type="module">
  const { EditorView, basicSetup, keymap, indentWithTab, Prec, python, oneDark, indentUnit } =
    await import("./assets/codemirror.min.js");

  const { samples } = await import("./assets/samples.js");

  const statusEl = document.getElementById("status");
  const outEl = document.getElementById("output");
  const runBtn = document.getElementById("run");

  const fileSelect = document.getElementById("fileSelect");
  const sampleSelect = document.getElementById("sampleSelect");
  const fileNewBtn = document.getElementById("fileNew");
  const fileCopyBtn = document.getElementById("fileCopy");
  const fileRenameBtn = document.getElementById("fileRename");
  const fileDeleteBtn = document.getElementById("fileDelete");

  const DEFAULT_NAME = "main.py";
  const STARTER =
`# Welcome to the Python playground! 🐍
# Try changing this, then press Run.

name = input("What is your name? ")
print("Hello,", name, "👋")

for i in range(1, 4):
    print(i, "x 7 =", i * 7)
`;

  // ---------- Local file store (localStorage) ----------
  // files: { "main.py": "code", ... }   current: "main.py"
  const FILES_KEY = "editor:files";
  const CURRENT_KEY = "editor:current";

  function loadFiles() {
    try {
      const raw = JSON.parse(localStorage.getItem(FILES_KEY));
      if (raw && typeof raw === "object" && Object.keys(raw).length) return raw;
    } catch (_) { /* fall through to defaults */ }
    return { [DEFAULT_NAME]: STARTER };
  }
  function saveFiles(files) { localStorage.setItem(FILES_KEY, JSON.stringify(files)); }
  function getCurrentName() {
    const name = localStorage.getItem(CURRENT_KEY);
    return name && files[name] !== undefined ? name : Object.keys(files)[0];
  }
  function setCurrentName(name) { current = name; localStorage.setItem(CURRENT_KEY, name); }

  let files = loadFiles();
  let current = getCurrentName();
  saveFiles(files);          // persist defaults on first visit
  setCurrentName(current);

  // Normalise a user-entered name: trim, add .py if missing.
  function normaliseName(input) {
    let name = (input || "").trim();
    if (!name) return "";
    if (!/\.py$/i.test(name)) name += ".py";
    return name;
  }
  // Suggest an unused name like "untitled.py", "untitled2.py", ...
  function uniqueName(base) {
    if (files[base] === undefined) return base;
    const stem = base.replace(/\.py$/i, "");
    let n = 2;
    while (files[`${stem}${n}.py`] !== undefined) n++;
    return `${stem}${n}.py`;
  }

  // ---------- Editor ----------
  const view = new EditorView({
    doc: files[current],
    extensions: [
      basicSetup,
      python(),
      oneDark,
      indentUnit.of("    "),
      // Prec.highest ensures Mod-Enter beats basicSetup's default Enter
      // binding; otherwise Ctrl/Cmd-Enter just inserts a newline.
      Prec.highest(keymap.of([
        { key: "Mod-Enter", preventDefault: true, run: () => { runCode(); return true; } },
      ])),
      // Tab indents, Shift-Tab dedents (uses the 4-space indentUnit above).
      keymap.of([indentWithTab]),
      // Auto-save the current file as you type (debounced).
      EditorView.updateListener.of((u) => { if (u.docChanged) scheduleSave(); }),
    ],
    parent: document.getElementById("editor"),
  });

  // Replace the whole editor document (keeps undo history).
  function setEditorText(text) {
    view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: text } });
  }

  // Debounced save of the editor buffer into the current file.
  let saveTimer = null;
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 300);
  }
  function saveNow() {
    files[current] = view.state.doc.toString();
    saveFiles(files);
  }

  // ---------- File dropdown + actions ----------
  function refreshFileSelect() {
    fileSelect.innerHTML = "";
    Object.keys(files).sort((a, b) => a.localeCompare(b)).forEach((name) => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      if (name === current) opt.selected = true;
      fileSelect.appendChild(opt);
    });
  }

  // Switch to another file, saving the current buffer first.
  function openFile(name) {
    if (files[name] === undefined) return;
    saveNow();
    setCurrentName(name);
    setEditorText(files[name]);
    refreshFileSelect();
  }

  function createFile(name, code) {
    files[name] = code;
    saveNow();            // make sure current buffer is kept before switching
    saveFiles(files);
    setCurrentName(name);
    setEditorText(code);
    refreshFileSelect();
  }

  fileSelect.addEventListener("change", () => openFile(fileSelect.value));

  fileNewBtn.addEventListener("click", () => {
    const input = prompt("New file name:", uniqueName("untitled.py"));
    if (input === null) return;
    const name = normaliseName(input);
    if (!name) return;
    if (files[name] !== undefined) {
      if (!confirm(`"${name}" already exists. Open it instead?`)) return;
      openFile(name);
      return;
    }
    createFile(name, "# " + name + "\n\n");
  });

  fileCopyBtn.addEventListener("click", () => {
    saveNow();
    const suggested = uniqueName("copy-of-" + current);
    const input = prompt(`Copy "${current}" to:`, suggested);
    if (input === null) return;
    const name = normaliseName(input);
    if (!name) return;
    if (files[name] !== undefined && !confirm(`"${name}" exists. Overwrite it?`)) return;
    createFile(name, files[current]);
  });

  fileRenameBtn.addEventListener("click", () => {
    const input = prompt(`Rename "${current}" to:`, current);
    if (input === null) return;
    const name = normaliseName(input);
    if (!name || name === current) return;
    if (files[name] !== undefined && !confirm(`"${name}" exists. Overwrite it?`)) return;
    saveNow();
    files[name] = files[current];
    delete files[current];
    saveFiles(files);
    setCurrentName(name);
    refreshFileSelect();
  });

  fileDeleteBtn.addEventListener("click", () => {
    if (!confirm(`Delete "${current}"? This cannot be undone.`)) return;
    delete files[current];
    // Never leave zero files: recreate the default if needed.
    if (Object.keys(files).length === 0) files[DEFAULT_NAME] = STARTER;
    saveFiles(files);
    const next = Object.keys(files).sort((a, b) => a.localeCompare(b))[0];
    setCurrentName(next);
    setEditorText(files[next]);
    refreshFileSelect();
  });

  // ---------- Samples dropdown ----------
  samples.forEach((s, i) => {
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = s.name;
    sampleSelect.appendChild(opt);
  });
  sampleSelect.addEventListener("change", () => {
    const idx = sampleSelect.value;
    sampleSelect.value = "";                 // reset so the same item can be re-picked
    if (idx === "") return;
    const sample = samples[Number(idx)];
    if (!sample) return;
    const hasContent = view.state.doc.toString().trim() !== "";
    // Offer to load into a new file so the current work is not lost.
    if (hasContent && confirm(`Load "${sample.name}" into a NEW file?\n\nOK = new file, Cancel = replace current file.`)) {
      createFile(uniqueName(normaliseName(sample.name.replace(/[^\w]+/g, "-")) || "sample.py"), sample.code);
    } else {
      setEditorText(sample.code);
      saveNow();
    }
  });

  refreshFileSelect();

  // Load Pyodide once.
  const { loadPyodide } = await import("https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.mjs");
  const pyodide = await loadPyodide();

  // Stream Python output to the panel as it is produced, and make input()
  // pop up a browser dialog. Output is written chunk-by-chunk (not buffered
  // until the program ends), so loops that print between input() prompts
  // show their text immediately — e.g. guess-the-number.

  // jsWrite(text, isErr): called by Python on every stdout/stderr write.
  globalThis.jsWrite = (text, isErr) => {
    wroteSinceTick = true;          // ensure the next tick paints this output
    appendOutput(text, isErr ? "error" : null);
  };

  // jsReadLine(): called by Python's input(). Instead of a pop-up dialog, we
  // place an inline text field right where the cursor is in the output box,
  // focus it, and resolve the Promise when the user presses Enter. The typed
  // text is then echoed (coloured) followed by a newline, like a real shell.
  let activeInput = null;
  globalThis.jsReadLine = () => new Promise((resolve) => {
    const field = document.createElement("input");
    field.type = "text";
    field.className = "inline-input";
    field.autocomplete = "off";
    field.autocapitalize = "off";
    field.spellcheck = false;
    field.setAttribute("aria-label", "Program input");

    // Grow the field to roughly fit what is typed, so it feels inline.
    const resize = () => { field.style.width = Math.max(4, field.value.length + 1) + "ch"; };
    field.addEventListener("input", resize);

    field.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const typed = field.value;
        field.remove();
        activeInput = null;
        outEl.classList.remove("awaiting-input");
        // Echo the answer (coloured) + newline into the normal output stream.
        appendOutput("\x01" + typed + "\x02\n", null);
        resolve(typed);
      }
    });

    outEl.appendChild(field);
    outEl.classList.add("awaiting-input");
    activeInput = field;
    resize();
    outEl.scrollTop = outEl.scrollHeight;
    field.focus();
  });

  // Clicking anywhere in the output focuses the active input, like a shell.
  outEl.addEventListener("mousedown", () => {
    if (activeInput && window.getSelection().toString() === "") {
      setTimeout(() => activeInput && activeInput.focus(), 0);
    }
  });

  // jsTick(): called by Python between statements. To keep tight compute
  // loops fast, we only actually yield a frame to the browser when output
  // was produced since the last yield, or ~50ms has elapsed. Otherwise we
  // return a resolved promise immediately. This gives incremental painting
  // for I/O-heavy programs without crawling on big number-crunching loops.
  let lastTick = 0;
  let wroteSinceTick = false;
  globalThis.jsTick = () => {
    const now = performance.now();
    if (wroteSinceTick || now - lastTick > 50) {
      wroteSinceTick = false;
      lastTick = now;
      return nextFrame();           // real paint
    }
    return Promise.resolve();       // cheap: no yield this time
  };

  pyodide.runPython(`
import builtins, sys, ast, asyncio, traceback
from js import jsWrite, jsReadLine, jsTick

class _JsOut:
    def __init__(self, is_err): self._is_err = is_err
    def write(self, s):
        if s: jsWrite(s, self._is_err)
        return len(s)
    def flush(self): pass

sys.stdout = _JsOut(False)
sys.stderr = _JsOut(True)

# input() is async now: it prints the prompt, then waits for the user to type
# into the inline field in the output box. The AST transform below rewrites
# plain input(...) calls into "await input(...)" so students write normal code.
async def input(prompt=""):
    if prompt:
        print(prompt, end="")   # streamed to the panel before the field
    return await jsReadLine()

builtins.input = input

async def __tick():
    # Yield to the browser so queued output paints.
    await jsTick()

# --- Automatic "await __tick()" insertion ---------------------------------
# We parse the student's code and insert a tick before each statement in the
# module body and at the start of every loop iteration. This lets output
# appear incrementally without the student needing to write async code.
class _Ticker(ast.NodeTransformer):
    def _tick_stmt(self):
        call = ast.Expr(ast.Await(ast.Call(
            func=ast.Name(id="__tick", ctx=ast.Load()), args=[], keywords=[])))
        return call

    def _instrument(self, body):
        out = []
        for stmt in body:
            out.append(self._tick_stmt())
            out.append(self.visit(stmt))
        return out

    def visit_For(self, node):
        node.body = self._instrument(node.body)
        node.orelse = [self.visit(n) for n in node.orelse]
        return node

    def visit_While(self, node):
        node.body = self._instrument(node.body)
        node.orelse = [self.visit(n) for n in node.orelse]
        return node

    # input() is async, so rewrite "input(...)" into "await input(...)".
    def visit_Call(self, node):
        self.generic_visit(node)
        if isinstance(node.func, ast.Name) and node.func.id == "input":
            return ast.Await(value=node)
        return node

    # Avoid double-wrapping if the user already wrote "await input(...)".
    def visit_Await(self, node):
        inner = node.value
        if (isinstance(inner, ast.Call) and isinstance(inner.func, ast.Name)
                and inner.func.id == "input"):
            inner.args = [self.visit(a) for a in inner.args]
            inner.keywords = [self.visit(k) for k in inner.keywords]
            return node
        self.generic_visit(node)
        return node

def __make_async(source):
    tree = ast.parse(source)
    ticker = _Ticker()
    new_body = []
    for stmt in tree.body:
        new_body.append(ticker._tick_stmt())
        new_body.append(ticker.visit(stmt))
    # Wrap everything in: async def __main(): <body>
    func = ast.AsyncFunctionDef(
        name="__main",
        args=ast.arguments(posonlyargs=[], args=[], vararg=None,
                           kwonlyargs=[], kw_defaults=[], kwarg=None, defaults=[]),
        body=new_body or [ast.Pass()],
        decorator_list=[], returns=None, type_comment=None,
    )
    module = ast.Module(body=[func], type_ignores=[])
    ast.fix_missing_locations(module)
    return module

async def __run_user_code(source):
    g = {"__name__": "__main__", "__tick": __tick}
    try:
        module = __make_async(source)
        code = compile(module, "<program>", "exec")
        exec(code, g)
        await g["__main"]()
    except SyntaxError:
        sys.stderr.write(traceback.format_exc())
    except BaseException:
        # Trim internal frames so the traceback points at the student's code.
        tb = traceback.format_exception(*sys.exc_info())
        cleaned = [line for line in tb if "__main" not in line and "__run_user_code" not in line]
        sys.stderr.write("".join(cleaned) or "".join(tb))
`);

  statusEl.textContent = "🐍 Python ready!";
  setTimeout(() => (statusEl.style.display = "none"), 2000);
  runBtn.disabled = false;

  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // ---------- Streaming output ----------
  // We append spans as text arrives. The typed-answer markers (\x01..\x02)
  // may be split across writes, so we track whether we are currently inside
  // an "answer" region and style accordingly.
  let inAnswer = false;

  function clearOutput(message) {
    outEl.textContent = message || "";   // also removes any pending input field
    outEl.classList.remove("awaiting-input");
    activeInput = null;
    inAnswer = false;
  }

  // Append a chunk, turning \x01..\x02 regions into coloured "answer" spans.
  function appendOutput(text, cls) {
    let i = 0;
    while (i < text.length) {
      if (inAnswer) {
        const end = text.indexOf("\x02", i);
        const slice = end === -1 ? text.slice(i) : text.slice(i, end);
        if (slice) addSpan(slice, "answer");
        if (end === -1) { i = text.length; } else { inAnswer = false; i = end + 1; }
      } else {
        const start = text.indexOf("\x01", i);
        const slice = start === -1 ? text.slice(i) : text.slice(i, start);
        if (slice) addSpan(slice, cls);
        if (start === -1) { i = text.length; } else { inAnswer = true; i = start + 1; }
      }
    }
    outEl.scrollTop = outEl.scrollHeight;
  }

  function addSpan(text, cls) {
    const span = document.createElement("span");
    if (cls) span.className = cls;
    span.textContent = text;
    outEl.appendChild(span);
  }

  // Give the browser a chance to paint queued output before we block on a
  // modal input() dialog or long work.
  function nextFrame() {
    return new Promise((resolve) => requestAnimationFrame(() => resolve()));
  }

  async function runCode() {
    const source = view.state.doc.toString();
    runBtn.disabled = true;
    clearOutput("");                 // (1) clear previous output on every run
    await nextFrame();               // let the clear paint before we start
    const run = pyodide.globals.get("__run_user_code");
    try {
      // Run the student's code through the async runner, which inserts
      // `await __tick()` between statements so output paints incrementally.
      await run(source);
      if (!outEl.textContent) clearOutput("(no output)");
    } catch (e) {
      // Only reached for errors outside the Python try/except above.
      appendOutput(String(e && e.message || e), "error");
    } finally {
      run.destroy();
      runBtn.disabled = false;
    }
  }

  runBtn.addEventListener("click", runCode);
</script>
