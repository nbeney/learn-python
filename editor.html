<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>📝 Python Editor</title>
<!-- Shared snake favicon across all pages. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>" />

<!-- Apply the saved theme before paint to avoid a flash of the wrong colours. -->
<script>
  (function () {
    var t = localStorage.getItem("theme") || "system";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>

<style>
  /* Light theme is the base. */
  :root {
    --bg: #f6f8fa;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #57606a;
    --accent: #0969da;
    --border: #d0d7de;
  }
  :root[data-theme="dark"] {
    --bg: #0d1117;
    --card: #161b22;
    --text: #e6edf3;
    --muted: #9da7b3;
    --accent: #58a6ff;
    --border: #30363d;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="system"], :root:not([data-theme]) {
      --bg: #0d1117;
      --card: #161b22;
      --text: #e6edf3;
      --muted: #9da7b3;
      --accent: #58a6ff;
      --border: #30363d;
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    padding: 1rem;
    gap: .8rem;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: .5rem;
  }
  header h1 { font-size: 2.4rem; margin: 0; }

  .toolbar { display: flex; gap: .5rem; align-items: center; }
  .btn {
    border: none; font-weight: 600; font-size: .9rem;
    padding: .45rem 1rem; border-radius: 8px; cursor: pointer;
  }
  .run-btn { background: var(--accent); color: #fff; }
  .run-btn:disabled { opacity: .6; cursor: wait; }
  /* While a program is running the same button becomes a red Stop button. */
  .run-btn.stop-btn { background: #cf222e; }
  :root[data-theme="dark"] .run-btn.stop-btn { background: #da3633; }

  /* Run button row, right-aligned directly under the editor. */
  .run-row { display: flex; justify-content: flex-end; }

  /* The file toolbar is hidden by default; the menu toggles it on. */
  body:not(.toolbar-visible) .toolbar { display: none; }

  /* File manager + samples controls in the toolbar. */
  .files { display: inline-flex; align-items: center; gap: .3rem; }
  .files-label { font-size: 1rem; line-height: 1; }
  .select {
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font: inherit; font-size: .9rem; padding: .4rem .5rem;
    cursor: pointer; max-width: 11rem;
  }
  .select:hover { border-color: var(--accent); }
  .icon-btn {
    background: var(--card); color: var(--text);
    border: 1px solid var(--border);
    padding: .4rem .55rem; font-size: .9rem; line-height: 1;
  }
  .icon-btn:hover { border-color: var(--accent); }
  /* Let the hint wrap to a new line on narrow screens. */
  .toolbar { flex-wrap: wrap; }

  /* ---------- Corner menu (navigation + theme) ---------- */
  /* Align the menu's right edge with the page content (body has 1rem padding). */
  .menu { position: fixed; top: 12px; right: 1rem; z-index: 50; }
  .menu-btn {
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 1.2rem; line-height: 1; cursor: pointer;
    width: 42px; height: 42px;
  }
  .menu-btn:hover { border-color: var(--accent); }
  .menu-panel {
    position: absolute; top: 48px; right: 0;
    min-width: 180px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: .4rem;
    box-shadow: 0 10px 24px rgba(0,0,0,.22);
    display: none;
  }
  .menu.open .menu-panel { display: block; }
  .menu-panel a {
    display: block; text-decoration: none;
    color: var(--text); font-size: .95rem;
    padding: .5rem .6rem; border-radius: 8px;
  }
  .menu-panel a:hover { background: rgba(127,127,127,.14); }
  .menu-panel a[aria-current="page"] {
    color: var(--muted); font-weight: 600; pointer-events: none;
  }
  .menu-panel a[aria-current="page"]::after { content: " ●"; color: var(--accent); }
  .menu-sep { height: 1px; background: var(--border); margin: .4rem .2rem; }
  .menu-label { font-size: .75rem; color: var(--muted); padding: .2rem .6rem; }

  /* The snake emoji in the title links home; keep it looking like plain text. */
  .home-emoji { color: inherit; text-decoration: none; cursor: pointer; }
  .home-emoji:hover { filter: brightness(1.15); }

  /* Theme switcher (Light / Dark / System), lives inside the menu. */
  .theme-switch {
    display: flex; gap: .15rem; padding: .2rem .4rem .3rem;
  }
  .theme-switch button {
    flex: 1; background: transparent; border: 1px solid var(--border);
    cursor: pointer; color: var(--muted); font-size: .95rem; line-height: 1;
    padding: .4rem; border-radius: 8px;
  }
  .theme-switch button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .theme-switch button:hover { color: var(--text); }
  .theme-switch button[aria-pressed="true"]:hover { color: #fff; }

  /* Workspace holds the code pane and the output. Stacked (column) by
     default; switches to side-by-side (row) on wider screens via the media
     query below. It grows to fill the remaining body height. */
  .workspace {
    flex: 1 1 auto;
    min-height: 0;              /* allow children to shrink/scroll */
    display: flex;
    flex-direction: column;
    gap: .8rem;
  }

  /* The code pane stacks the editor and the Run button row. */
  .code-pane {
    flex: 1 1 auto;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    gap: .8rem;
  }

  /* The result pane stacks an optional chart box above the output box. */
  .result-pane {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* Editor fills the code pane. */
  .editor-wrap {
    flex: 1 1 auto;
    min-height: 140px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .cm-editor { height: 100%; font-size: 1rem; }
  .cm-editor.cm-focused { outline: none; }

  .output {
    /* Stacked mode: a capped box below the editor. */
    flex: 0 0 auto;
    max-height: 40vh; overflow: auto;
    background: #000; color: #ffffff;
    border-radius: 8px; padding: .7rem .9rem; min-height: 2.4rem;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 1rem; white-space: pre-wrap;
    /* Box-drawing characters (Rich tables/panels) only tile seamlessly at a
       tight line-height, so keep it modest; the larger font-size carries most
       of the readability. 1.2 is about the ceiling before gaps reappear. */
    line-height: 1.2;
    border: 1px solid var(--border);
    display: flex; flex-direction: column;   /* canvas can grow to fill */
  }

  /* Side-by-side layout on wider screens: code on the left, result pane
     (chart + output) on the right, each taking half the width. */
  @media (min-width: 820px) {
    .workspace { flex-direction: row; align-items: stretch; }
    .code-pane { flex: 1 1 50%; min-width: 0; }
    .result-pane { flex: 1 1 50%; min-width: 0; align-self: stretch; }
    .output {
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;         /* fill the remaining column height */
    }
  }
  .output .answer { color: #ffd866; font-weight: 600; }
  .output .error { color: #ff9c8a; }

  /* Inline input() field: looks like typing straight into the output. */
  .output .inline-input {
    background: transparent; border: none; outline: none;
    color: #ffd866; font-weight: 600;
    font-family: inherit; font-size: inherit;
    padding: 0; margin: 0; min-width: 4ch;
    caret-color: #ffd866;
  }
  .output.awaiting-input { cursor: text; }

  /* Chart from matplotlib (plt.show()) lives in its OWN box above the output.
     The box is hidden until a chart is drawn. */
  .chart-box {
    display: none;
    flex: 0 0 auto;
    background: var(--card);
    border: 1px solid var(--border); border-radius: 8px;
    padding: .5rem; margin-bottom: .8rem;
    text-align: center;
  }
  .chart-box.show { display: block; }
  .chart-img {
    display: block;
    max-width: 100%;
    max-height: 30vh;              /* keep the chart box a sensible height */
    width: auto; height: auto;
    object-fit: contain;
    margin: 0 auto;
    background: #fff; border-radius: 6px;
  }
  @media (min-width: 820px) {
    .chart-img { max-height: 38vh; }
  }

  /* GUI window from guizero (app.display()) lives in its OWN box above the
     output, like the chart box. Hidden until a program displays an App. */
  .gui-box {
    display: none;
    flex: 0 0 auto;
    background: var(--card);
    border: 1px solid var(--border); border-radius: 8px;
    padding: .6rem; margin-bottom: .8rem;
    max-height: 50vh; overflow: auto;
  }
  .gui-box.show { display: block; }
  /* The window title bar (App title). */
  .gui-title {
    font-weight: 600; font-size: .95rem;
    color: var(--text); margin: 0 0 .5rem;
    padding-bottom: .4rem; border-bottom: 1px solid var(--border);
  }
  /* The root container holds the widgets. Auto layout = centered column. */
  .gui-root { display: flex; flex-direction: column; align-items: center; gap: .5rem; }
  /* A guizero Box is just a nested container with the same behaviour. */
  .gui-box-widget { display: flex; flex-direction: column; align-items: center; gap: .5rem; }
  .gui-box-widget.bordered { border: 1px solid var(--border); border-radius: 6px; padding: .5rem; }
  /* Grid layout containers switch from flex to CSS grid. */
  .gui-root.grid, .gui-box-widget.grid { display: grid; gap: .5rem; align-items: start; justify-items: start; }

  /* Widget base styling, themed to match the editor. */
  .gui-root button, .gui-box-widget button {
    font: inherit; font-size: .9rem; font-weight: 600;
    padding: .4rem .9rem; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
  }
  .gui-root button:disabled, .gui-box-widget:disabled { opacity: .6; cursor: default; }
  .gui-root input[type="text"], .gui-box-widget input[type="text"],
  .gui-root select, .gui-box-widget select {
    font: inherit; font-size: .9rem;
    padding: .35rem .5rem; border-radius: 8px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
  }
  .gui-text { color: var(--text); font-size: .95rem; }
  .gui-group { display: flex; gap: .4rem; }
  .gui-group.vertical { flex-direction: column; align-items: flex-start; }
  .gui-group label { display: inline-flex; align-items: center; gap: .3rem; color: var(--text); font-size: .92rem; }
  .gui-check { display: inline-flex; align-items: center; gap: .4rem; color: var(--text); font-size: .92rem; }
  .gui-slider { display: inline-flex; align-items: center; gap: .5rem; }

  /* Turtle drawing surface. Hidden until a program uses the turtle module. */
  .turtle-wrap { display: none; margin-bottom: .6rem; min-height: 0; }
  .turtle-wrap.show { display: flex; }
  /* The drawing canvas and the cursor overlay are stacked on top of each
     other. The overlay holds only the turtle cursor so it can be redrawn
     without disturbing the permanent drawing underneath. */
  .turtle-stack {
    position: relative;
    flex: 1 1 auto; min-height: 0;
    width: 100%; height: 100%;
  }
  #turtleCanvas, #turtleCursor {
    display: block; position: absolute; inset: 0;
    /* Fill the whole output area (rectangular, matching its aspect ratio). */
    width: 100%; height: 100%;
    border-radius: 8px;
  }
  #turtleCanvas {
    background: #fff; border: 1px solid var(--border);
  }
  /* Overlay is transparent and never intercepts clicks. */
  #turtleCursor { background: transparent; border: 1px solid transparent; pointer-events: none; }
  /* When turtle is active, let the canvas take all available output height. */
  .turtle-wrap.show { flex: 1 1 auto; min-height: 0; }

  /* In stacked (narrow) mode the output has no fixed height, so give it a
     usable drawing area when a turtle program is running. In side-by-side
     mode the output already stretches to the code pane height. */
  .output.has-turtle { max-height: none; }
  @media (max-width: 819px) {
    .output.has-turtle { height: 60vh; }
  }

  /* Status toast: a prominent, centered-at-top notification for app state
     like "Loading Python" / "Python ready". Non-blocking (pointer-events
     off) so it never gets in the way of the editor. */
  #status {
    position: fixed; top: 18px; left: 50%;
    transform: translateX(-50%) translateY(-8px);
    z-index: 100; pointer-events: none;
    display: inline-flex; align-items: center; gap: .55rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 5px solid var(--accent);     /* coloured accent by state */
    color: var(--text); font-size: 1rem; font-weight: 600;
    padding: .7rem 1.2rem; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    opacity: 0; transition: opacity .25s ease, transform .25s ease;
  }
  /* Visible state (toggled from JS by adding/removing .hidden). */
  #status:not(.hidden) { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* A small spinner shown while something is loading. */
  #status::before {
    content: ""; width: 1.05em; height: 1.05em; flex: 0 0 auto;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%;
    animation: status-spin .7s linear infinite;
  }
  /* "Ready"/success state: green accent, no spinner (show a tick instead). */
  #status.ready {
    border-left-color: #2da44e;
  }
  :root[data-theme="dark"] #status.ready { border-left-color: #3fb950; }
  #status.ready::before {
    content: "✅"; width: auto; height: auto;
    border: none; animation: none; font-size: 1.05em; line-height: 1;
  }
  @keyframes status-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    #status::before { animation: none; }
    #status { transition: opacity .25s ease; }
  }

  .hint { color: var(--muted); font-size: .82rem; margin: 0; }
  footer { text-align: center; color: var(--muted); font-size: .85rem; margin-top: .4rem; }
</style>

<!-- Menu + theme wiring. Standalone so it works regardless of Pyodide. -->
<script>
  (function () {
    var root = document.documentElement;
    var buttons = document.querySelectorAll(".theme-switch button");
    function applyTheme(theme) {
      root.setAttribute("data-theme", theme);
      localStorage.setItem("theme", theme);
      buttons.forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.themeValue === theme));
      });
    }
    buttons.forEach(function (b) {
      b.addEventListener("click", function () { applyTheme(b.dataset.themeValue); });
    });
    applyTheme(localStorage.getItem("theme") || "system");

    var menu = document.getElementById("menu");
    var menuBtn = document.getElementById("menuBtn");
    if (menu && menuBtn) {
      function setOpen(open) {
        menu.classList.toggle("open", open);
        menuBtn.setAttribute("aria-expanded", String(open));
      }
      menuBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        setOpen(!menu.classList.contains("open"));
      });
      document.addEventListener("click", function (e) {
        if (!menu.contains(e.target)) setOpen(false);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") setOpen(false);
      });
    }

    // File toolbar visibility: hidden by default, toggled from the menu and
    // remembered across visits.
    var toolbarToggle = document.getElementById("toolbarToggle");
    if (toolbarToggle) {
      function applyToolbar(visible) {
        document.body.classList.toggle("toolbar-visible", visible);
        toolbarToggle.setAttribute("aria-checked", String(visible));
        toolbarToggle.textContent = (visible ? "✅" : "⬜") + " Toolbar";
        localStorage.setItem("editor:toolbar", visible ? "1" : "0");
      }
      applyToolbar(localStorage.getItem("editor:toolbar") === "1"); // default hidden
      toolbarToggle.addEventListener("click", function (e) {
        e.preventDefault();
        applyToolbar(!document.body.classList.contains("toolbar-visible"));
      });
    }
  })();
</script>

<!-- CodeMirror 6 (locally bundled) + Pyodide.

<script type="module">

    await import("./assets/codemirror.min.js");

  const { samples } = await import("./assets/samples.js");

  const statusEl = document.getElementById("status");

  // Status toast helpers. `setStatus(text)` shows a spinner + message (the
  // "working" state); `setStatus(text, {ready:true})` shows a green tick for
  // success. `hideStatus()` fades it out. Returns the previous text so a
  // caller can restore it (used by the lazy loaders).
  function setStatus(text, opts) {
    const prev = statusEl.textContent;
    statusEl.textContent = text;
    statusEl.classList.toggle("ready", !!(opts && opts.ready));
    statusEl.classList.remove("hidden");
    return prev;
  }
  function hideStatus() {
    statusEl.classList.add("hidden");
  }
  const outEl = document.getElementById("output");

`# Welcome to the Python playground! 🐍
# Press Run to run this program. Then try changing it or type your own program.

import time

def safe_input_int(prompt: str) -> int:
    # Keep asking until the person types a whole number.
    while True:
        answer = input(prompt)
        if answer.strip().lstrip("-").isdigit():
            return int(answer)
        print("🤔 That is not a whole number. Please try again!")

from js import jsWrite, jsReadLine, jsTick, jsStopRequested, jsReadLineStopSentinel

# Value jsReadLine() resolves with when the user pressed Stop while an input()
# was waiting. We compare against it to raise a clean stop (resolving instead
# of rejecting the JS promise avoids Pyodide's "invalid exception object").
_STOP_SENTINEL = jsReadLineStopSentinel()

# Raised to unwind the program when the Stop button is pressed. Inherits from
# BaseException (not Exception) so a student's "except Exception" can't swallow
# it — Stop always works, just like KeyboardInterrupt.
class _Stopped(BaseException):
    pass

class _JsOut:
    def __init__(self, is_err): self._is_err = is_err
    encoding = "utf-8"
    def write(self, s):
        if s: jsWrite(s, self._is_err)
        return len(s)
    def flush(self): pass
    # Report as a real terminal so libraries like Rich emit ANSI colour codes
    # (our output pane interprets them). This makes the SAME code that a child
    # writes here also produce colour in a real terminal.
    def isatty(self): return True

sys.stdout = _JsOut(False)
sys.stderr = _JsOut(True)

# input() is async now: it prints the prompt, then waits for the user to type
# into the inline field in the output box. The AST transform below rewrites
# plain input(...) calls into "await input(...)" so students write normal code.
async def input(prompt=""):
    if prompt:
        print(prompt, end="")   # streamed to the panel before the field
    answer = await jsReadLine()
    if answer == _STOP_SENTINEL:
        # Stop was pressed while this input() was waiting.
        raise _Stopped()
    return answer

builtins.input = input

async def __tick():
    # Yield to the browser so queued output paints, then stop if requested.
    await jsTick()
    if jsStopRequested():
        raise _Stopped()

# --- Make input() work anywhere, with incremental output ------------------
# Because our async input() must be awaited, any function that uses input()
# (directly, or by calling another such function) has to become "async def",
# and calls to those functions must be awaited too. We work out which
# functions are "async" with a simple fixpoint, then transform the tree:
#   * def -> async def           for async functions
#   * input(...)   -> await input(...)
#   * asyncfunc(...) -> await asyncfunc(...)
#   * insert "await __tick()"     in the module body and loop bodies
# so that output appears incrementally without the student writing async code.

# Single leading underscore (not dunder): a leading "__" would be name-mangled
# to _AsyncRewriter__is_requests_call when referenced inside the rewriter class.
def _is_requests_call(node):
    # True for requests.get(...) / requests.post(...): an attribute call where
    # the method is get/post and the object is the name "requests". Scoped this
    # tightly so we never await an unrelated .get() (e.g. dict.get()).
    return (isinstance(node, ast.Call)
            and isinstance(node.func, ast.Attribute)
            and node.func.attr in ("get", "post")
            and isinstance(node.func.value, ast.Name)
            and node.func.value.id == "requests")

def __collect_async_funcs(tree):
    # Map each top-level-ish function name to the set of function names it
    # calls, and note which call input() directly.
    calls = {}        # name -> set of called Name ids
    uses_input = set()
    has_loop = set()  # functions whose body contains a loop (gets a __tick)

    class _Scan(ast.NodeVisitor):
        def __init__(self): self.stack = []
        def _visit_func(self, node):
            self.stack.append(node.name)
            calls.setdefault(node.name, set())
            self.generic_visit(node)
            self.stack.pop()
        visit_FunctionDef = _visit_func
        visit_AsyncFunctionDef = _visit_func
        def _visit_loop(self, node):
            # A loop body gets an injected "await __tick()", so the enclosing
            # function must become async too.
            if self.stack:
                has_loop.add(self.stack[-1])
            self.generic_visit(node)
        visit_For = _visit_loop
        visit_While = _visit_loop
        def visit_Call(self, node):
            if self.stack and isinstance(node.func, ast.Name):
                calls[self.stack[-1]].add(node.func.id)
                if node.func.id == "input":
                    uses_input.add(self.stack[-1])
            # engine.runAndWait() blocks on speech, and requests.get/post()
            # go over the network, so both must be awaited; that forces the
            # enclosing function to become async too.
            if self.stack and (isinstance(node.func, ast.Attribute)
                               and node.func.attr == "runAndWait"):
                uses_input.add(self.stack[-1])
            if self.stack and _is_requests_call(node):
                uses_input.add(self.stack[-1])
            self.generic_visit(node)

    _Scan().visit(tree)

    async_funcs = set(uses_input) | has_loop
    changed = True
    while changed:
        changed = False
        for fn, callees in calls.items():
            if fn in async_funcs:
                continue
            if "input" in callees or (callees & async_funcs):
                async_funcs.add(fn)
                changed = True
    return async_funcs

class _AsyncRewriter(ast.NodeTransformer):
    def __init__(self, async_funcs):
        self.async_funcs = async_funcs

    def _tick_stmt(self):
        return ast.Expr(ast.Await(ast.Call(
            func=ast.Name(id="__tick", ctx=ast.Load()), args=[], keywords=[])))

    def _instrument(self, body):
        out = []
        for stmt in body:
            out.append(self._tick_stmt())
            out.append(self.visit(stmt))
        return out

    def visit_For(self, node):
        node.body = self._instrument(node.body)
        node.orelse = [self.visit(n) for n in node.orelse]
        return node

    def visit_While(self, node):
        node.body = self._instrument(node.body)
        node.orelse = [self.visit(n) for n in node.orelse]
        return node

    def visit_FunctionDef(self, node):
        self.generic_visit(node)
        if node.name in self.async_funcs:
            # Turn "def f(...)" into "async def f(...)".
            new = ast.AsyncFunctionDef(
                name=node.name, args=node.args, body=node.body,
                decorator_list=node.decorator_list, returns=node.returns,
                type_comment=getattr(node, "type_comment", None))
            ast.copy_location(new, node)
            return new
        return node

    def _is_async_call(self, node):
        # Calls we must await: input(), user functions marked async, the
        # pyttsx3 engine.runAndWait() method (blocks on speech), and
        # requests.get/post() (go over the network via fetch).
        if isinstance(node, ast.Call):
            if isinstance(node.func, ast.Name) and (
                    node.func.id == "input" or node.func.id in self.async_funcs):
                return True
            if isinstance(node.func, ast.Attribute) and node.func.attr == "runAndWait":
                return True
            if _is_requests_call(node):
                return True
        return False

    def visit_Call(self, node):
        self.generic_visit(node)
        if self._is_async_call(node):
            return ast.Await(value=node)
        return node

    def visit_Await(self, node):
        # Don't double-await something already awaited.
        inner = node.value
        if self._is_async_call(inner):
            inner.args = [self.visit(a) for a in inner.args]
            inner.keywords = [self.visit(k) for k in inner.keywords]
            return node
        self.generic_visit(node)
        return node

def __make_async(source):
    tree = ast.parse(source)
    async_funcs = __collect_async_funcs(tree)
    rewriter = _AsyncRewriter(async_funcs)
    new_body = []
    for stmt in tree.body:
        new_body.append(rewriter._tick_stmt())
        new_body.append(rewriter.visit(stmt))
    # Wrap everything in: async def __main(): <body>
    func = ast.AsyncFunctionDef(
        name="__main",
        args=ast.arguments(posonlyargs=[], args=[], vararg=None,
                           kwonlyargs=[], kw_defaults=[], kwarg=None, defaults=[]),
        body=new_body or [ast.Pass()],
        decorator_list=[], returns=None, type_comment=None,
    )
    module = ast.Module(body=[func], type_ignores=[])
    ast.fix_missing_locations(module)
    return module

async def __run_user_code(source):
    g = {"__name__": "__main__", "__tick": __tick}
    try:
        module = __make_async(source)
        code = compile(module, "<program>", "exec")
        exec(code, g)
        await g["__main"]()
    except _Stopped:
        # User pressed Stop: show a calm message, not a traceback.
        sys.stdout.write("\\n⏹ Stopped.\\n")
    except SyntaxError:
        sys.stderr.write(traceback.format_exc())
    except BaseException:
        # Trim internal frames so the traceback points at the student's code.
        tb = traceback.format_exception(*sys.exc_info())
        cleaned = [line for line in tb if "__main" not in line and "__run_user_code" not in line]
        sys.stderr.write("".join(cleaned) or "".join(tb))

import sys, math, types
from js import (jsTurtleShow, jsTurtleBg, jsTurtleClear,
                jsTurtleLine, jsTurtleDot, jsTurtleFill, jsTurtleSize,
                jsTurtleCursor)

# The drawing area is rectangular and matches the output pane. We read its
# size (CSS pixels) each time the turtle starts, place the origin at the
# centre, and use 1 unit = 1 pixel (so forward(100) draws a 100px line),
# just like classic turtle — the extra space simply gives more room.
def _size():
    s = jsTurtleSize()
    return (float(s[0]), float(s[1]))

# Named colours that students use most; anything else is passed through as-is
# (CSS accepts names like "red", "skyblue" and "#ff8800").
def _coltostr(c):
    if isinstance(c, (tuple, list)) and len(c) == 3:
        r, g, b = c
        # turtle allows 0..1 floats or 0..255 ints; detect floats.
        if all(isinstance(v, float) and 0 <= v <= 1 for v in c):
            r, g, b = (int(round(v * 255)) for v in c)
        return "rgb(%d,%d,%d)" % (int(r), int(g), int(b))
    return str(c)

def _chan255(v):
    # Map one colour channel to 0..255. A float means the 0..1 scale; an int
    # means it is already 0..255. Clamp to the valid range either way.
    x = v * 255.0 if isinstance(v, float) else float(v)
    return max(0, min(255, int(round(x))))

def greyscale(n):
    # Return a grey colour string. n may be a float 0..1 or an int 0..255.
    g = _chan255(n)
    return "rgb(%d,%d,%d)" % (g, g, g)

def hsb(hue, saturation, brightness):
    # Return a colour string from HSB/HSV. hue is 0..360; saturation and
    # brightness may each be a float 0..1 or an int 0..255. Usable anywhere a
    # colour is expected, e.g. pencolor(hsb(200, 1.0, 1.0)).
    h = (float(hue) % 360.0) / 60.0
    s = _chan255(saturation) / 255.0
    v = _chan255(brightness) / 255.0
    i = int(h) % 6
    f = h - int(h)
    p = v * (1.0 - s)
    q = v * (1.0 - s * f)
    t = v * (1.0 - s * (1.0 - f))
    r, g, b = ((v, t, p), (q, v, p), (p, v, t),
               (p, q, v), (t, p, v), (v, p, q))[i]
    return "rgb(%d,%d,%d)" % (int(round(r * 255)), int(round(g * 255)), int(round(b * 255)))

_W, _H = 400.0, 400.0              # drawing area size, refreshed on turtle start

def _to_canvas(x, y):
    # turtle (0,0) centre, y up  ->  canvas top-left origin, y down
    return (_W / 2 + x, _H / 2 - y)

_next_turtle_id = 0                # unique id per Turtle, for the cursor overlay

class Turtle:
    def __init__(self):

        _next_turtle_id += 1

        self._y = 0.0
        self._heading = 0.0        # degrees, 0 = east, CCW positive

        self._fillcolor = "#000000"
        self._width = 1.0

    def _goto(self, x, y):

            cx, cy = _to_canvas(self._x, self._y)
            self._fillpts.extend([cx, cy])

    def _draw_cursor(self):

        # heading. Canvas y points down, so the heading angle is negated. The
        # id keeps multiple turtles independent so one does not erase another.
        cx, cy = _to_canvas(self._x, self._y)

                       self._pencolor, bool(self._visible), bool(self._down))

    # --- Movement ---

        a = math.radians(self._heading)
        self._goto(self._x + d * math.cos(a), self._y + d * math.sin(a))
    def backward(self, d):

        self._draw_cursor()
    def left(self, a):

        self._draw_cursor()

    def sety(self, y): self._goto(self._x, y)

from js import (jsSpeechSpeak, jsSpeechWait, jsSpeechStop, jsSpeechVoices)

class _Voice:
    # Mirrors pyttsx3.voice.Voice (the attributes students usually read).
    def __init__(self, id, name):
        self.id = id
        self.name = name
        self.languages = []
        self.gender = None
        self.age = None
    def __repr__(self):
        return "<Voice id=%s name=%s>" % (self.id, self.name)

class _Engine:
    def __init__(self):
        self._queue = []
        self._rate = 200        # pyttsx3 default is ~200 wpm
        self._volume = 1.0      # 0.0 .. 1.0
        self._voice = ""        # selected voice id (empty = browser default)

    # --- speaking -------------------------------------------------------
    def say(self, text, name=None):
        # Like pyttsx3: queue the text; nothing is spoken until runAndWait().
        self._queue.append(str(text))

    async def runAndWait(self):
        # Flush the queue to the browser, then wait until speech finishes.
        for text in self._queue:
            jsSpeechSpeak(text, self._rate, self._volume, self._voice)
        self._queue = []
        await jsSpeechWait()

    def stop(self):
        self._queue = []
        jsSpeechStop()

    # --- properties -----------------------------------------------------
    def getProperty(self, name):
        if name == "rate":
            return self._rate
        if name == "volume":
            return self._volume
        if name == "voice":
            return self._voice
        if name == "voices":
            # jsSpeechVoices() returns a synchronous snapshot (warmed up on
            # first use by the lazy speech hook in runCode()).
            raw = jsSpeechVoices()
            try:
                items = raw.to_py() if hasattr(raw, "to_py") else list(raw)
            except Exception:
                items = []
            return [_Voice(v["id"], v["name"]) for v in items]
        return None

    def setProperty(self, name, value):
        if name == "rate":
            self._rate = float(value)
        elif name == "volume":
            self._volume = max(0.0, min(1.0, float(value)))
        elif name == "voice":
            self._voice = str(value) if value is not None else ""

_engine_singleton = None

def init(driverName=None, debug=False):
    # pyttsx3.init() returns a shared engine instance; mimic that.
    global _engine_singleton
    if _engine_singleton is None:
        _engine_singleton = _Engine()
    return _engine_singleton

_mod.init = init
_mod.Engine = _Engine

import sys, types, json as _json
from js import jsHttpFetch

class RequestsError(Exception):
    pass

# Raised on a network/CORS failure, with a message aimed at young learners.
class ConnectionError(RequestsError):
    pass

class HTTPError(RequestsError):
    pass

_FRIENDLY = (
    "Could not reach that website from the browser editor. "
    "This often happens because the site blocks browser requests (CORS). "
    "Try a CORS-friendly API like Open-Meteo, or run it in Thonny "
    "after 'pip install requests'."
)

class Response:
    def __init__(self, status_code, text, url):
        self.status_code = status_code
        self.text = text
        self.url = url

    @property
    def ok(self):
        return 200 <= self.status_code < 400

    @property
    def content(self):
        # Real requests returns bytes; give students the UTF-8 bytes.
        return self.text.encode("utf-8")

    def json(self):
        return _json.loads(self.text)

    def raise_for_status(self):
        if not self.ok:
            raise HTTPError("Request to %s failed with status %d"
                            % (self.url, self.status_code))

    def __repr__(self):
        return "<Response [%d]>" % self.status_code


async def _do(method, url, data=None, json=None):
    body = None
    content_type = None
    if json is not None:
        body = _json.dumps(json)
        content_type = "application/json"
    elif data is not None:
        if isinstance(data, dict):
            # Simple form encoding for dict bodies.
            from urllib.parse import urlencode
            body = urlencode(data)
            content_type = "application/x-www-form-urlencoded"
        else:
            body = str(data)
            content_type = "text/plain"
    result = await jsHttpFetch(method, url, body, content_type)
    r = result.to_py() if hasattr(result, "to_py") else result
    if r["error"]:
        # Network error or CORS block.
        raise ConnectionError(_FRIENDLY)
    return Response(r["status"], r["text"], url)


async def get(url, params=None):
    # Append simple query params if given as a dict.
    if params:
        from urllib.parse import urlencode
        sep = "&" if "?" in url else "?"
        url = url + sep + urlencode(params)
    return await _do("GET", url)

async def post(url, data=None, json=None):
    return await _do("POST", url, data=data, json=json)


_mod = types.ModuleType("requests")
_mod.get = get
_mod.post = post
_mod.Response = Response
_mod.RequestsError = RequestsError
_mod.ConnectionError = ConnectionError
_mod.HTTPError = HTTPError
# Nested exceptions namespace, like requests.exceptions.*
_exc = types.ModuleType("requests.exceptions")
_exc.RequestException = RequestsError
_exc.ConnectionError = ConnectionError
_exc.HTTPError = HTTPError
_mod.exceptions = _exc
sys.modules["requests"] = _mod
sys.modules["requests.exceptions"] = _exc

  // Append a chunk of program output. Handles three things interleaved:
  //   * ANSI/SGR colour codes (\x1b[...m) -> styled spans (for Rich, etc.)
  //   * typed-answer markers (\x01..\x02) -> the "answer" colour
  //   * plain text
  // A partial escape at the end of a chunk is buffered in ansiPending.
  function appendOutput(text, cls) {
    text = ansiPending + text;
    ansiPending = "";
    let i = 0, n = text.length;
    let run = "";
    const flush = () => {
      if (run) { addSpan(run, cls); run = ""; }
    };
    while (i < n) {
      const ch = text[i];
      if (ch === "\x1b") {
        // Escape sequence. We only act on SGR ("\x1b[...m"); others are skipped.
        if (i + 1 >= n) { ansiPending = text.slice(i); break; }   // wait for more
        if (text[i + 1] === "[") {
          // Find the final byte (a letter) of the CSI sequence.
          let j = i + 2;
          while (j < n && !/[A-Za-z]/.test(text[j])) j++;
          if (j >= n) { ansiPending = text.slice(i); break; }     // incomplete
          flush();
          if (text[j] === "m") {
            const body = text.slice(i + 2, j);
            const codes = body === "" ? [0] : body.split(";").map((x) => parseInt(x || "0", 10));
            applyAnsiCodes(codes);
          }
          // Non-"m" CSI codes (cursor moves, clears) are ignored in A1.
          i = j + 1;
        } else {
          i += 1;   // lone ESC or other escape; drop it
        }
      } else if (ch === "\x01") {        // start typed answer
        flush(); inAnswer = true; i += 1;
      } else if (ch === "\x02") {        // end typed answer
        flush(); inAnswer = false; i += 1;
      } else {
        run += ch; i += 1;
      }
    }
    flush();
    outEl.scrollTop = outEl.scrollHeight;
  }

  // Create a span for a run of text, styled by the current ANSI state (plus
  // any base class). The typed-answer colour wins so echoed input stays gold.
  function addSpan(text, cls) {
    const span = document.createElement("span");
    const css = ansiToCss(ansiStyle);
    if (inAnswer) {
      span.className = "answer";
    } else if (cls) {
      span.className = cls;
    }
    if (css && !inAnswer) span.setAttribute("style", css);
    span.textContent = text;
    outTextEl.appendChild(span);
  }

  // Give the browser a chance to paint queued output before we block on a
  // modal input() dialog or long work.
  function nextFrame() {
    return new Promise((resolve) => requestAnimationFrame(() => resolve()));
  }

  // ---------- Lazy matplotlib ----------
  // matplotlib is a multi-MB download, so we only fetch it the first time a
  // program actually uses it, then configure a non-interactive backend and
  // make plt.show() render the figure as a PNG into the output area.
  let matplotlibReady = false;
  function usesMatplotlib(src) {
    return /\bmatplotlib\b/.test(src) || /\bpylab\b/.test(src);
  }
  async function ensureMatplotlib() {
    if (matplotlibReady) return;
    setStatus("Loading charts… (one-time)");
    await nextFrame();
    await pyodide.loadPackage("matplotlib");
    // Configure once: use the Agg backend and send figures to JS as PNGs.
    pyodide.runPython(`
import matplotlib
matplotlib.use("AGG")              # render to an in-memory bitmap, no GUI
import matplotlib.pyplot as _plt
import io, base64
from js import jsChart

def _show(*args, **kwargs):
    # Render every open figure to a PNG data URL and hand it to the page.
    for num in _plt.get_fignums():
        fig = _plt.figure(num)
        buf = io.BytesIO()
        fig.savefig(buf, format="png", dpi=110, bbox_inches="tight")
        buf.seek(0)
        data = base64.b64encode(buf.read()).decode("ascii")
        jsChart("data:image/png;base64," + data)
    _plt.close("all")              # start fresh for the next run

_plt.show = _show
`);
    matplotlibReady = true;
    hideStatus();
  }

  // ---------- Lazy speech (pyttsx3 shim) ----------
  // Nothing to download — speechSynthesis is built into the browser. The only
  // one-time cost is waiting for the OS voice list to populate, so we warm it
  // up the first time a program imports pyttsx3 (mirrors ensureMatplotlib()).
  let speechReady = false;
  function usesSpeech(src) {
    return /\bpyttsx3\b/.test(src);
  }
  async function ensureSpeech() {
    if (speechReady) return;
    setStatus("Preparing speech…");
    await nextFrame();
    if (globalThis.jsSpeechWarm) await globalThis.jsSpeechWarm();
    speechReady = true;
    hideStatus();
  }

  // ---------- GUI (guizero shim) detection ----------
  // Nothing to download — the GUI is rendered with the DOM. We only need to
  // know whether a program uses guizero so the run can keep the Python event
  // callbacks alive after the top-level code finishes (see runCode()).
  function usesGuizero(src) {
    return /\bguizero\b/.test(src);
  }

  // ---------- Lazy Rich ----------
  // Rich prints colours/tables/panels using ANSI codes, which our output pane
  // now understands. We install it on first use, and force it into "terminal"
  // mode with truecolour so the SAME code also shows colour in a real
  // terminal. We never monkeypatch Rich, so kids write ordinary Rich code.
  let richReady = false;
  function usesRich(src) {
    return /\brich\b/.test(src);
  }
  // Estimate how many monospace characters fit across the output pane, so Rich
  // sizes tables/rules to fit (set via the COLUMNS env var before each run).
  function outputColumns() {
    // Measure the width of a single monospace character in the output font.
    const probe = document.createElement("span");
    probe.textContent = "0".repeat(100);
    probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;";
    outTextEl.appendChild(probe);
    const charW = probe.getBoundingClientRect().width / 100 || 8;
    probe.remove();
    const style = getComputedStyle(outEl);
    const padX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
    const avail = outEl.clientWidth - padX;
    return Math.max(20, Math.min(200, Math.floor(avail / charW)));
  }
  async function ensureRich() {
    if (richReady) return;
    setStatus("Loading Rich… (one-time)");
    await nextFrame();
    // Rich ships in Pyodide as a pure-Python package; fall back to micropip.
    try {
      await pyodide.loadPackage("rich");
    } catch (e) {
      await pyodide.loadPackage("micropip");
      await pyodide.runPythonAsync("import micropip\nawait micropip.install('rich')");
    }
    // Force colour + truecolour via the environment, so unmodified Rich code
    // emits ANSI here (and behaves the same in a real terminal).
    pyodide.runPython(`
import os
os.environ["FORCE_COLOR"] = "1"
os.environ["COLORTERM"] = "truecolor"
os.environ["TERM"] = "xterm-256color"
`);
    richReady = true;
    hideStatus();
  }

  async function runCode() {
    const source = view.state.doc.toString();
    enterRunningState();             // button becomes ⏹ Stop; clears stop flag
    clearOutput("");                 // (1) clear previous output on every run
    // Reset the turtle module's default-turtle singleton so a program that
    // uses turtle re-reveals the canvas (clearOutput hides it every run).
    pyodide.runPython("import sys\nif 'turtle' in sys.modules: sys.modules['turtle']._reset()");
    // Reset the guizero window so each run starts with an empty GUI.
    pyodide.runPython("import sys\nif 'guizero' in sys.modules: sys.modules['guizero']._reset()");
    // Lazily fetch matplotlib the first time a program needs it.
    if (usesMatplotlib(source)) {
      try {
        await ensureMatplotlib();
      } catch (e) {
        appendOutput("Could not load charts: " + String(e && e.message || e), "error");
        exitRunningState();
        return;
      }
    }
    // Warm up speech voices the first time a program uses pyttsx3.
    if (usesSpeech(source)) {
      try {
        await ensureSpeech();
      } catch (e) {
        appendOutput("Could not start speech: " + String(e && e.message || e), "error");
        exitRunningState();
        return;
      }
    }
    // Install Rich the first time a program needs it, and size it to the pane.
    if (usesRich(source)) {
      try {
        await ensureRich();
        // Tell Rich how wide the output is so tables/rules fit the box.
        pyodide.runPython('import os; os.environ["COLUMNS"] = "' + outputColumns() + '"');
      } catch (e) {
        appendOutput("Could not load Rich: " + String(e && e.message || e), "error");
        exitRunningState();
        return;
      }
    }
    await nextFrame();               // let the clear paint before we start
    const run = pyodide.globals.get("__run_user_code");
    try {
      // Run the student's code through the async runner, which inserts
      // `await __tick()` between statements so output paints incrementally.
      await run(source);
      // The chart has its own box, so a chart alone still counts as "no
      // output" in the text box. The turtle draws inside the output box, so
      // it does suppress the placeholder.
      if (!outTextEl.textContent && !turtleWrap.classList.contains("show")
          && !guiBox.classList.contains("show")) {
        appendOutput("(no output)", null);
      }
    } catch (e) {
      // Only reached for errors outside the Python try/except above.
      appendOutput(String(e && e.message || e), "error");
    } finally {
      run.destroy();
      exitRunningState();            // button returns to ▶ Run
      // Return focus to the editor when the run ends — but NOT on touch
      // devices, where focusing pops the on-screen keyboard and hides the
      // output box. There the user can tap the editor to resume typing.
      if (!isTouchDevice()) view.focus();
    }
  }

  // The one button toggles: Run when idle, Stop while a program is running.
  runBtn.addEventListener("click", () => {
    if (isRunning) requestStop();
    else runCode();
  });
</script>
</body>
</html>
